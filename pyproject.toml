[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clicktrans"
version = "0.1.0"
description = "鼠标框选即可实时翻译的小工具，支持中文 / 日语 / 英语三语互译"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.2.3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
capture = ["dxcam>=0.0.5"]
pack = ["pyinstaller>=6.0"]

[project.gui-scripts]
clicktrans = "clicktrans.__main__:main"

[tool.setuptools]
packages = [
    "clicktrans",
    "clicktrans.capture",
    "clicktrans.ocr",
    "clicktrans.translate",
    "clicktrans.ui",
    "clicktrans.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
